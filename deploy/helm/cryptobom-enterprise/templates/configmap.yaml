apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cryptobom-enterprise.fullname" . }}-config
  labels:
    {{- include "cryptobom-enterprise.labels" . | nindent 4 }}
data:
  CRYPTOBOM_EDITION: {{ .Values.enterprise.edition | quote }}
  CRYPTOBOM_PORT: {{ .Values.service.targetPort | quote }}
  PORT: {{ .Values.service.targetPort | quote }}
  CRYPTOBOM_LOG_LEVEL: {{ .Values.enterprise.logLevel | quote }}
  IBMQ_ENABLED: {{ ternary "true" "false" .Values.config.ibmqEnabled | quote }}
  QUANTUM_ENABLED: {{ ternary "true" "false" .Values.config.quantumEnabled | quote }}
  {{- if .Values.enterprise.licenseTenantId }}
  CRYPTOBOM_LICENSE_TENANT_ID: {{ .Values.enterprise.licenseTenantId | quote }}
  {{- end }}
  {{- if .Values.enterprise.customerId }}
  CRYPTOBOM_CUSTOMER_ID: {{ .Values.enterprise.customerId | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
