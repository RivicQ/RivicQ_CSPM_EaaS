{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cryptobom-enterprise.secretName" . }}
  labels:
    {{- include "cryptobom-enterprise.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (or set secrets.existingSecret)" .Values.secrets.jwtSecret | quote }}
  CRYPTOBOM_LICENSE_KEY: {{ required "secrets.licenseKey is required (or set secrets.existingSecret)" .Values.secrets.licenseKey | quote }}
  CRYPTOBOM_LICENSE_SIGNING_KEY: {{ required "secrets.licenseSigningKey is required (or set secrets.existingSecret)" .Values.secrets.licenseSigningKey | quote }}
  {{- $entdb := default .Values.enterprise.enterpriseDatabaseUrl .Values.secrets.enterpriseDatabaseUrl }}
  {{- if $entdb }}
  ENTERPRISE_DATABASE_URL: {{ $entdb | quote }}
  {{- end }}
  {{- if .Values.secrets.ibmqApiKey }}
  IBMQ_API_KEY: {{ .Values.secrets.ibmqApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.ibmqNetwork }}
  IBMQ_NETWORK: {{ .Values.secrets.ibmqNetwork | quote }}
  {{- end }}
{{- end }}
