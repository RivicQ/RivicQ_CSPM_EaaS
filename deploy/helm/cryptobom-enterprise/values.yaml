nameOverride: ""
fullnameOverride: ""

image:
  repository: rivicq/cryptobom-enterprise
  tag: "2.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cryptobom-enterprise.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# Enterprise runtime is fail-closed: DATABASE_URL, JWT_SECRET, license key and
# signing key are required. Demo/fabricated data is never served as real.
enterprise:
  edition: enterprise
  logLevel: info
  # If set, enterprise tables run in a separate DB (must be explicit; never reused silently).
  enterpriseDatabaseUrl: ""
  # Optional tenant/customer binding enforced by license validation.
  licenseTenantId: ""
  customerId: ""
  migration:
    enabled: true
    backoffLimit: 3

secrets:
  # Use existingSecret to source sensitive values from a pre-created Secret.
  existingSecret: ""
  create: true
  databaseUrl: ""
  enterpriseDatabaseUrl: ""
  jwtSecret: ""
  licenseKey: ""
  licenseSigningKey: ""
  ibmqApiKey: ""
  ibmqNetwork: ""

config:
  ibmqEnabled: false
  quantumEnabled: false
  extraEnv: {}
