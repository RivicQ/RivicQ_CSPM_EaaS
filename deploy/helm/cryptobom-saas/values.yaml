# Default values for cryptobom-saas.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: rivic-q/cryptobom-saas
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
    add:
    - SYS_ADMIN  # Required for eBPF
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  privileged: true  # Required for eBPF scanning

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: cryptobom.rivic-q.io
      paths:
        - path: /
          pathType: Prefix
  tls: 
    - secretName: cryptobom-tls
      hosts:
        - cryptobom.rivic-q.io

resources:
  limits:
    cpu: 2
    memory: 4Gi
    ephemeral-storage: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 500Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Database Configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "cryptobom-postgres"
    database: "cryptobom_saas"
  primary:
    persistence:
      enabled: true
      size: 20Gi

# Monitoring
prometheus:
  enabled: true
  server:
    retention: "30d"
    persistentVolume:
      enabled: true
      size: 20Gi

grafana:
  enabled: true
  adminPassword: "cryptobom-admin"
  persistence:
    enabled: true
    size: 10Gi

# IBM Quantum Integration
ibmQuantum:
  enabled: true
  apiKey: ""
  network: "ibm-quantum-network"
  attestation: true

# eBPF Configuration
ebpf:
  enabled: true
  privileged: true
  hostPID: true
  hostNetwork: true

# Cilium CNI for advanced networking and security
cilium:
  enabled: true
  kubeProxyReplacement: "strict"
  hubble:
    enabled: true
    ui:
      enabled: true

# Headlamp Integration
headlamp:
  enabled: true
  namespace: "headlamp-system"
  plugin:
    enabled: true
    name: "cryptobom-plugin"

# Service Mesh (Istio)
istio:
  enabled: true
  namespace: "istio-system"
  mTLS:
    enabled: true

# Certificate Management
certManager:
  enabled: true
  namespace: "cert-manager"

# OpenTelemetry
openTelemetry:
  enabled: true
  collector:
    enabled: true
    config: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      exporters:
        prometheus:
          endpoint: "0.0.0.0:8889"
        jaeger:
          endpoint: jaeger-collector:14250
          tls:
            insecure: true
      processors:
        batch:
        memory_limiter:
          limit_mib: 512
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [jaeger]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [prometheus]

# Security Configuration
security:
  rbac:
    enabled: true
  podSecurityPolicy:
    enabled: true
  networkPolicy:
    enabled: true
    ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
    egress:
      - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system

# Node Affinity and Tolerations
nodeSelector: {
  "kubernetes.io/os": "linux",
  "kubernetes.io/arch": "amd64"
}

tolerations:
- key: "node-role.kubernetes.io/master"
  operator: "Exists"
  effect: "NoSchedule"
- key: "node-role.kubernetes.io/control-plane"
  operator: "Exists"
  effect: "NoSchedule"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - cryptobom-saas
        topologyKey: kubernetes.io/hostname