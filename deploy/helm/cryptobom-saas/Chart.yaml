apiVersion: v2
name: cryptobom-saas
description: CryptoBOM SaaS - Cryptographic Bill of Materials platform with quantum-safe attestation
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - security
  - cryptography
  - quantum
  - cbom
  - attestation
  - nist

home: https://github.com/rivic-q/cryptobom-saas
sources:
  - https://github.com/rivic-q/cryptobom-saas

maintainers:
  - name: Revan Ande
    email: engineering@rivicq.com

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: prometheus
    version: 25.x.x
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: 10.x.x
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled

annotations:
  category: Security
  licenses: Apache-2.0