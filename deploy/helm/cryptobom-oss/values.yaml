# Default values for cryptobom-oss.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  demoMode: false

replicaCount: 2

image:
  registry: docker.io
  repository: rivicq/cryptobom-oss
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
database:
  enabled: true
  externalHost: ""
  externalPort: 5432
  externalUser: ""
  externalPassword: ""
  externalDatabase: ""
  postgresql:
    auth:
      postgresPassword: "cryptobom123"
      database: "cryptobom"
      username: "cryptobom"
    primary:
      persistence:
        enabled: true
        size: 1Gi
        storageClass: ""

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 256Mi
      storageClass: ""

# Monitoring configuration
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}

# Demo configuration
demo:
  enabled: false
  sampleData: true
  autoScan: true

# API Configuration
api:
  cors:
    enabled: true
    origins:
      - "*"
  rateLimit:
    enabled: false
    requestsPerMinute: 100
  logging:
    level: "info"
    format: "json"

# Security
security:
  rbac:
    create: true
  podSecurityPolicy:
    enabled: false

# Observability
observability:
  openTelemetry:
    enabled: true
    endpoint: "http://jaeger:14268/api/traces"
  metrics:
    enabled: true
    port: 9090

# Headlamp Plugin
headlamp:
  enabled: false
  plugin:
    name: "cryptobom"
    version: "0.1.0"

# eBPF Scanner
ebpf:
  enabled: false
  privileged: false

# Feature flags
features:
  quantumAttestation: false
  advancedThreatDetection: false
  mlAnalytics: false
  multiCloudSupport: false