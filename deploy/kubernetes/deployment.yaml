apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptobom-server
  namespace: cryptobom-system
  labels:
    app: cryptobom-server
    version: "1.3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cryptobom-server
  template:
    metadata:
      labels:
        app: cryptobom-server
        version: "1.3.0"
    spec:
      serviceAccountName: cryptobom-sa
      containers:
        - name: cryptobom-server
          # Image is parameterized. Set IMAGE env var or run through envsubst in CI.
          # Example: IMAGE=europe-west3-docker.pkg.dev/${PROJECT_ID}/cryptobom/server:1.3.0 kubectl apply -f deployment.yaml
          image: ${IMAGE:-docker.io/rivicq/cryptobom-oss:latest}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: cryptobom-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: JWT_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        fsGroup: 2000
