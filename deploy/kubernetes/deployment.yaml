apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptobom-server
  namespace: cryptobom-system
  labels:
    app: cryptobom-server
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cryptobom-server
  template:
    metadata:
      labels:
        app: cryptobom-server
    spec:
      serviceAccountName: cryptobom-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: cryptobom-server
          image: ghcr.io/rivic-q/cryptobom-saas:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: database-url
            - name: CRYPTOBOM_EDITION
              valueFrom:
                configMapKeyRef:
                  name: cryptobom-config
                  key: edition
            - name: IBM_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: ibm-api-key
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: aws-access-key
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: aws-secret-key
                  optional: true
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: cryptobom-config
                  key: gcp-project-id
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cryptobom-server
  namespace: cryptobom-system
  annotations:
    iam.gke.io/gcp-service-account: cryptobom-server@PROJECT_ID.iam.gserviceaccount.com
