apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptobom-enterprise
  namespace: cryptobom-system
  labels:
    app: cryptobom-enterprise
    edition: enterprise
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cryptobom-enterprise
  template:
    metadata:
      labels:
        app: cryptobom-enterprise
        edition: enterprise
        version: "2.0.0"
    spec:
      serviceAccountName: cryptobom-sa
      securityContext:
        fsGroup: 2000
      containers:
        - name: cryptobom-enterprise
          image: rivicq/cryptobom-enterprise:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: http
          envFrom:
            - configMapRef:
                name: cryptobom-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: DATABASE_URL
            - name: ENTERPRISE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: ENTERPRISE_DATABASE_URL
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: JWT_SECRET
            - name: CRYPTOBOM_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: CRYPTOBOM_LICENSE_KEY
            - name: CRYPTOBOM_LICENSE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: CRYPTOBOM_LICENSE_SIGNING_KEY
            - name: CRYPTOBOM_LICENSE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: CRYPTOBOM_LICENSE_TENANT_ID
                  optional: true
            - name: CRYPTOBOM_CUSTOMER_ID
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: CRYPTOBOM_CUSTOMER_ID
                  optional: true
            - name: IBMQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cryptobom-secrets
                  key: IBMQ_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
