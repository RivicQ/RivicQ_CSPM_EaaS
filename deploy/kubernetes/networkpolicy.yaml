apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cryptobom-network-policy
  namespace: cryptobom-system
spec:
  podSelector:
    matchLabels:
      app: cryptobom-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6379
