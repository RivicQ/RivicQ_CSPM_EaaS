apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptobom-config
  namespace: cryptobom-system
  labels:
    app: cryptobom-enterprise
    edition: enterprise
data:
  CRYPTOBOM_EDITION: "enterprise"
  PORT: "9090"
  CRYPTOBOM_PORT: "9090"
  CRYPTOBOM_LOG_LEVEL: "info"
  # DATABASE_URL must be provided via Secret (fail-closed; no demo/fabricated data).
  # ENTERPRISE_DATABASE_URL is optional and only for an explicit separate enterprise DB.
  QUANTUM_ENABLED: "false"
  IBMQ_ENABLED: "false"
