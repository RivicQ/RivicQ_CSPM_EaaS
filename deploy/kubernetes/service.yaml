apiVersion: v1
kind: Service
metadata:
  name: cryptobom-enterprise
  namespace: cryptobom-system
  labels:
    app: cryptobom-enterprise
    edition: enterprise
spec:
  selector:
    app: cryptobom-enterprise
  ports:
    - name: http
      port: 80
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cryptobom-enterprise-lb
  namespace: cryptobom-system
  labels:
    app: cryptobom-enterprise
    edition: enterprise
spec:
  selector:
    app: cryptobom-enterprise
  ports:
    - name: http
      port: 80
      targetPort: 9090
  type: LoadBalancer
