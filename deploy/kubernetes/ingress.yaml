apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cryptobom-ingress
  namespace: cryptobom-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - cryptobom.example.com
      secretName: cryptobom-tls
  rules:
    - host: cryptobom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cryptobom-server
                port:
                  number: 80
