# DO NOT commit actual secrets. Use kubectl create secret or an external secrets operator.
# Enterprise startup is fail-closed: DATABASE_URL, JWT_SECRET,
# CRYPTOBOM_LICENSE_KEY, and CRYPTOBOM_LICENSE_SIGNING_KEY are required.
apiVersion: v1
kind: Secret
metadata:
  name: cryptobom-secrets
  namespace: cryptobom-system
  labels:
    app: cryptobom-enterprise
    edition: enterprise
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/cryptobom?sslmode=require"
  # Optional: only when using a separate enterprise database (explicit opt-in).
  # ENTERPRISE_DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/cryptobom_enterprise?sslmode=require"
  JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET"
  CRYPTOBOM_LICENSE_KEY: "REPLACE_WITH_SIGNED_LICENSE"
  CRYPTOBOM_LICENSE_SIGNING_KEY: "REPLACE_WITH_LICENSE_SIGNING_KEY"
  # Optional bindings/integrations
  # CRYPTOBOM_LICENSE_TENANT_ID: "00000000-0000-0000-0000-000000000001"
  # CRYPTOBOM_CUSTOMER_ID: ""
  # IBMQ_API_KEY: ""
