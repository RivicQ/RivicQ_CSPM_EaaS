# Secret template — DO NOT put real values here.
# Populate via: kubectl create secret generic cryptobom-secrets --from-env-file=.secrets.env
apiVersion: v1
kind: Secret
metadata:
  name: cryptobom-secrets
  namespace: cryptobom-system
type: Opaque
stringData:
  database-url: "postgres://cryptobom:CHANGE_ME@db-host:5432/cryptobom?sslmode=require"
  ibm-api-key: "CHANGE_ME"
  aws-access-key: "CHANGE_ME"
  aws-secret-key: "CHANGE_ME"
  jwt-secret: "CHANGE_ME_USE_openssl_rand_base64_64"
