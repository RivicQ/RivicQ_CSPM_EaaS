apiVersion: v1
kind: Namespace
metadata:
  name: cryptobom-system
  labels:
    name: cryptobom-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptobom-config
  namespace: cryptobom-system
data:
  config.yaml: |
    edition: oss
    logLevel: info
    providers:
      - mock
    compliance:
      - NIST
      - ISO
      - BSI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptobom-oss
  namespace: cryptobom-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cryptobom-oss
  template:
    metadata:
      labels:
        app: cryptobom-oss
    spec:
      containers:
      - name: cryptobom
        image: rivicq/cryptobom-oss:v1.3.0
        ports:
        - containerPort: 9090
        env:
        - name: EDITION
          value: "oss"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: config
          mountPath: /app/config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: cryptobom-config
---
apiVersion: v1
kind: Service
metadata:
  name: cryptobom-oss
  namespace: cryptobom-system
spec:
  selector:
    app: cryptobom-oss
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cryptobom-oss-lb
  namespace: cryptobom-system
spec:
  selector:
    app: cryptobom-oss
  ports:
  - port: 80
    targetPort: 9090
  type: LoadBalancer
