services:
  mock-api:
    build:
      context: .
      dockerfile: demo/mock-api/Dockerfile
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/scans"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://mock-api:5000/api/v1
    ports:
      - "3000:80"
    depends_on:
      mock-api:
        condition: service_healthy

  scanner:
    build:
      context: .
      dockerfile: cmd/scanner/Dockerfile
    depends_on:
      mock-api:
        condition: service_healthy
    environment:
      - SCANNER_API_BASE=http://mock-api:5000/api/v1
    command: ["-target=localhost"]

networks:
  default:
    driver: bridge
