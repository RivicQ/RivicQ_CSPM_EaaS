<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/brand/rivicq-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101614" />
    <script>
      (function () {
        var KEY = 'rivicq.theme';
        function choiceOf(raw) {
          if (raw === 'harbor' || raw === 'dark') return 'harbor';
          if (raw === 'ledger' || raw === 'light') return 'ledger';
          return 'auto';
        }
        function resolved(choice) {
          if (choice === 'harbor') return 'dark';
          if (choice === 'ledger') return 'light';
          var light = false;
          try { light = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch (e) {}
          return light ? 'light' : 'dark';
        }
        var choice = 'auto';
        try { choice = choiceOf(localStorage.getItem(KEY)); } catch (e) {}
        var mode = resolved(choice);
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.setAttribute('data-theme-choice', choice);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#F3EFE6' : '#101614');
        var path = location.pathname;
        var notice = path.match(/^(.*)\/NOTICE$/);
        var md = path.match(/^(.*)\/([^/]+)\.md$/i);
        if (notice) {
          var noticePrefix = notice[1].replace(/\/docs$/, '');
          location.replace(noticePrefix + '/archify/site/index.html#types/notice');
        } else if (md) {
          var prefix = md[1].replace(/\/docs$/, '');
          var slug = md[2].replace(/\.md$/i, '').toLowerCase();
          location.replace(prefix + '/archify/site/index.html#types/' + encodeURIComponent(slug));
        }
      })();
    </script>
    <style>
      :root, [data-theme="dark"] {
        --rq-bg: #101614; --rq-sidebar: #0c1210; --rq-surface: #1a2420; --rq-raised: #24302b;
        --rq-text: #f4f7f5; --rq-muted: #c3cfc9; --rq-faint: #8fa099; --rq-line: #31403a;
        --rq-accent: #d7b56a; --rq-accent-2: #f0d59a;
        --rq-btn-bg: #e4c27a; --rq-btn-bg-hover: #f0d59a; --rq-btn-fg: #1a1408;
        --rq-nav-active: rgba(228,194,122,0.18); --rq-nav-hover: rgba(244,247,245,0.06);
        --rq-shadow: 0 18px 40px rgba(0,0,0,0.45); --rq-focus: #f0d59a;
      }
      [data-theme="light"] {
        --rq-bg: #f3efe6; --rq-sidebar: #e7e1d4; --rq-surface: #fffcf7; --rq-raised: #efe8dc;
        --rq-text: #1c1915; --rq-muted: #5c564c; --rq-faint: #7a7368; --rq-line: #d5cbba;
        --rq-accent: #8c5a2b; --rq-accent-2: #1e3f36;
        --rq-btn-bg: #1e3f36; --rq-btn-bg-hover: #16332c; --rq-btn-fg: #f6f1e6;
        --rq-nav-active: rgba(30,63,54,0.12); --rq-nav-hover: rgba(28,25,21,0.05);
        --rq-shadow: 0 18px 40px rgba(28,25,21,0.08); --rq-focus: #1e3f36;
      }
      body { background: var(--rq-bg); color: var(--rq-text); }
    </style>
    <meta name="description" content="RivicQ — Cryptographic Security Posture Management. Discover, inventory, and assess cryptographic assets. Community CBOM/SBOM (Apache 2.0) and Enterprise QBOM/HBOM/AIBOM/IBOM." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>RivicQ — Cryptographic Security Posture Management</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
