server {
    listen 4431 ssl;
    server_name nginx-tls10.demo;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Intentionally weak: TLS 1.0 only, RC4 cipher
    ssl_protocols       TLSv1;
    ssl_ciphers         RC4-SHA:RC4-MD5:DES-CBC3-SHA;
    ssl_prefer_server_ciphers on;

    location / {
        return 200 "NGINX Demo: TLS 1.0 / RC4 — Intentionally Vulnerable\n";
        add_header Content-Type text/plain;
    }
}
