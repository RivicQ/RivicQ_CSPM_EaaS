server {
    listen 4432 ssl;
    server_name nginx-tls12.demo;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # TLS 1.2 only, no ECDHE — no forward secrecy
    ssl_protocols       TLSv1.2;
    ssl_ciphers         AES128-SHA:AES256-SHA:AES128-SHA256;
    ssl_prefer_server_ciphers on;

    location / {
        return 200 "NGINX Demo: TLS 1.2 / No Forward Secrecy — Intentionally Weak\n";
        add_header Content-Type text/plain;
    }
}
