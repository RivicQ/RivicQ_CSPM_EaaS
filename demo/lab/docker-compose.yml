version: '3.8'

services:
  # ── CRITICAL: TLS 1.0 with RC4, RSA-1024, SHA-1 cert ───────────────────────
  nginx-tls10:
    image: nginx:alpine
    ports:
      - "4431:4431"
    volumes:
      - ./nginx/weak-tls10.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/tls10.crt:/etc/nginx/ssl/server.crt:ro
      - ./certs/tls10.key:/etc/nginx/ssl/server.key:ro
    restart: unless-stopped

  # ── HIGH: TLS 1.2 without forward secrecy, RSA-2048/SHA-256 ────────────────
  nginx-tls12-weak:
    image: nginx:alpine
    ports:
      - "4432:4432"
    volumes:
      - ./nginx/weak-tls12.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/tls12.crt:/etc/nginx/ssl/server.crt:ro
      - ./certs/tls12.key:/etc/nginx/ssl/server.key:ro
    restart: unless-stopped

  # ── REFERENCE: TLS 1.3, ECDHE, AES-256-GCM, RSA-4096/SHA-256 ───────────────
  nginx-good:
    image: nginx:alpine
    ports:
      - "4433:4433"
    volumes:
      - ./nginx/good-tls13.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/tls13.crt:/etc/nginx/ssl/server.crt:ro
      - ./certs/tls13.key:/etc/nginx/ssl/server.key:ro
    restart: unless-stopped

  # ── CRITICAL: SSH with DSA host key and weak KEX ────────────────────────────
  ssh-weak:
    image: linuxserver/openssh-server:latest
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - PUBLIC_KEY_FILE=/dev/null
    volumes:
      - ./sshd/sshd_config:/etc/ssh/sshd_config:ro
    restart: unless-stopped

  # ── CRITICAL: Legacy MD5 hash API (Python HTTP server) ──────────────────────
  openssl-md5-api:
    image: python:3.9-slim
    ports:
      - "5001:5001"
    command: >
      python3 -c "
      import http.server, hashlib, urllib.parse
      class H(http.server.BaseHTTPRequestHandler):
          def log_message(self, *a): pass
          def do_GET(self):
              qs = urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)
              data = qs.get('data', [''])[0].encode()
              result = hashlib.md5(data).hexdigest()
              self.send_response(200)
              self.send_header('Content-Type','text/plain')
              self.end_headers()
              self.wfile.write(result.encode())
      http.server.HTTPServer(('',5001),H).serve_forever()
      "
    restart: unless-stopped

  # ── CRITICAL: Java 8 with RSA-512 key and MD5withRSA ────────────────────────
  java-legacy:
    image: openjdk:8-jre-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./certs/java-keystore.p12:/app/keystore.p12:ro
    command: >
      sh -c "
      cat > /tmp/Server.java << 'EOF'
      import javax.net.ssl.*;
      import java.net.*;
      import java.io.*;
      import java.security.*;
      public class Server {
        public static void main(String[] a) throws Exception {
          KeyStore ks = KeyStore.getInstance(\"PKCS12\");
          ks.load(new FileInputStream(\"/app/keystore.p12\"), \"changeit\".toCharArray());
          KeyManagerFactory kmf = KeyManagerFactory.getInstance(\"SunX509\");
          kmf.init(ks, \"changeit\".toCharArray());
          SSLContext ctx = SSLContext.getInstance(\"TLS\");
          ctx.init(kmf.getKeyManagers(), null, null);
          SSLServerSocketFactory f = ctx.getServerSocketFactory();
          SSLServerSocket s = (SSLServerSocket)f.createServerSocket(8443);
          while(true){
            try {
              Socket c = s.accept();
              OutputStream o = c.getOutputStream();
              o.write(\"HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nJava Legacy TLS\".getBytes());
              o.flush(); c.close();
            } catch(Exception e){}
          }
        }
      }
      EOF
      cd /tmp && javac Server.java && java -Djdk.tls.server.enableRC4CipherSuites=true Server
      "
    restart: unless-stopped
