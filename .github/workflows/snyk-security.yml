# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Snyk scans need a Snyk account + API token. The steps below run only when a
# `SNYK_TOKEN` secret is configured in repo settings; without one the workflow
# skips cleanly instead of failing every push. Add the token to enable scans
# (details: https://github.com/snyk/actions#getting-your-snyk-token).

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snyk CLI to check for security issues
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      - name: Snyk Code test
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk code test --sarif > snyk-code.sarif || true

      - name: Snyk Open Source monitor
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk monitor --all-projects

      - name: Snyk IaC test and report
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk iac test --report || true

      - name: Build OSS image for container scan
        if: ${{ env.SNYK_TOKEN != '' }}
        run: docker build -f deploy/docker/Dockerfile.oss -t ${{ github.repository }}:oss-ci .

      - name: Snyk Container monitor
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk container monitor ${{ github.repository }}:oss-ci --file=deploy/docker/Dockerfile.oss

      - name: Upload Snyk Code results to GitHub Code Scanning
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      - name: Snyk not configured - skipping scan
        if: ${{ env.SNYK_TOKEN == '' }}
        run: |
          echo "SNYK_TOKEN is not configured in this repository."
          echo "Add it under Settings > Secrets and variables > Actions to enable Snyk Open Source/Code/IaC/Container scans."
          echo "Skipping Snyk scan (this run remains green)."
