name: Deploy GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build React SaaS app
        working-directory: web
        run: npm run build
        env:
          REACT_APP_EDITION: enterprise

      - name: Generate API docs (ReDoc)
        run: |
          # Build ReDoc HTML from the OpenAPI spec into the site's build
          npx redoc-cli@latest bundle docs/openapi.yaml -o web/build/api/index.html || true
        shell: bash

      - name: Add SPA redirect
        run: cp web/build/index.html web/build/404.html

      - name: Publish SDK & plugin docs to the site
        run: |
          mkdir -p web/build/docs/sdks
          cp docs/quantum-sdk.md web/build/docs/
          cp docs/plugin-development.md web/build/docs/
          cp docs/enterprise-sdk.md web/build/docs/
          cp docs/sdks/README.md web/build/docs/sdks/
          cp docs/sdks/rust.md web/build/docs/sdks/
          cp docs/sdks/python.md web/build/docs/sdks/
          cp docs/sdks/typescript.md web/build/docs/sdks/
          cp docs/sdks/java.md web/build/docs/sdks/
          cp docs/sdks/dotnet.md web/build/docs/sdks/
          cat > web/build/docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>CryptoBOM — SDK & Plugin Docs</title>
            <style>
              body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 48px 24px; }
              main { max-width: 760px; margin: 0 auto; }
              h1 { color: #fff; } h2 { color: #93c5fd; margin-top: 32px; }
              a { color: #67e8f9; } li { margin: 6px 0; }
              code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; }
            </style>
          </head>
          <body>
            <main>
              <h1>CryptoBOM — Quantum SDK &amp; Plugin Ecosystem</h1>
              <p>Complete open-source-to-enterprise documentation for the provider SDK and plugin platform.</p>
              <h2>Core docs</h2>
              <ul>
                <li><a href="quantum-sdk.md">Quantum SDK architecture (Go SDK core)</a></li>
                <li><a href="plugin-development.md">Plugin development guide</a></li>
                <li><a href="enterprise-sdk.md">Enterprise SDK &amp; plugin extension guide</a></li>
              </ul>
              <h2>Multi-language SDK specs</h2>
              <ul>
                <li><a href="sdks/README.md">Overview &amp; shared contract</a></li>
                <li><a href="sdks/rust.md">Rust</a></li>
                <li><a href="sdks/python.md">Python</a></li>
                <li><a href="sdks/typescript.md">TypeScript</a></li>
                <li><a href="sdks/java.md">Java</a></li>
                <li><a href="sdks/dotnet.md">.NET</a></li>
              </ul>
            </main>
          </body>
          </html>
          HTML

      - name: Copy media folder (animation + assets) into build
        run: |
          mkdir -p web/build/media
          cp -r media/. web/build/media/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
