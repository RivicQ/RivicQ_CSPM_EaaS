name: Deploy GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build React SaaS app
        working-directory: web
        run: npm run build
        env:
          REACT_APP_EDITION: community
          REACT_APP_SUPABASE_URL: https://suhoabdijefnsoxveewn.supabase.co
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8q50RgRBzXcuvjdaF7qBpg_E0GKHPt4

      - name: Generate API docs (ReDoc)
        run: |
          # Build ReDoc HTML from the OpenAPI spec into the site's build
          npx redoc-cli@latest bundle docs/openapi.yaml -o web/build/api/index.html || true
        shell: bash

      - name: Add SPA redirect
        run: cp web/build/index.html web/build/404.html

      - name: Publish SDK & plugin docs to the site
        run: |
          mkdir -p web/build/docs/sdks
          cp docs/quantum-sdk.md web/build/docs/
          cp docs/plugin-development.md web/build/docs/
          cp docs/security-intelligence.md web/build/docs/
          cp docs/README.md web/build/docs/README.md
          cp docs/KNOWN_LIMITATIONS.md web/build/docs/KNOWN_LIMITATIONS.md
          cp docs/LAUNCH_CHECKLIST.md web/build/docs/LAUNCH_CHECKLIST.md
          cp docs/PRODUCT_STATUS.md web/build/docs/PRODUCT_STATUS.md
          cp docs/ROADMAP.md web/build/docs/ROADMAP.md
          cp docs/QISKIT_PIPELINE.md web/build/docs/QISKIT_PIPELINE.md
          cp docs/ARCHITECTURE.md web/build/docs/ARCHITECTURE.md
          cp docs/CLIENT_ARCHITECTURE.md web/build/docs/CLIENT_ARCHITECTURE.md
          cp docs/BOM_FRAMEWORK.md web/build/docs/BOM_FRAMEWORK.md
          cp docs/UX_DESIGN.md web/build/docs/UX_DESIGN.md
          cp docs/CONTACT.md web/build/docs/CONTACT.md
          cp docs/contact.html web/build/docs/contact.html
          mkdir -p web/build/docs/assets
          cp docs/assets/horizon-docs.css web/build/docs/assets/horizon-docs.css
          cp docs/PQC_MIGRATION.md web/build/docs/PQC_MIGRATION.md
          cp docs/editions.md web/build/docs/editions.md
          cp DATASETS.md web/build/docs/DATASETS.md
          cp LEGAL.md web/build/docs/LEGAL.md
          cp PRIVACY.md web/build/docs/PRIVACY.md
          cp TRADEMARKS.md web/build/docs/TRADEMARKS.md
          cp NOTICE web/build/docs/NOTICE
          cp CONTRIBUTING.md web/build/docs/CONTRIBUTING.md
          cp SECURITY.md web/build/docs/SECURITY.md
          cp docs/sdks/README.md web/build/docs/sdks/
          cp docs/sdks/rust.md web/build/docs/sdks/
          cp docs/sdks/python.md web/build/docs/sdks/
          cp docs/sdks/typescript.md web/build/docs/sdks/
          cp docs/sdks/java.md web/build/docs/sdks/
          cp docs/sdks/dotnet.md web/build/docs/sdks/
          cp docs/index.html web/build/docs/index.html
          mkdir -p web/build/media
          cp -r media/. web/build/media/
          mkdir -p web/build/marketing
          cp -r marketing/. web/build/marketing/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/build
          publish_branch: gh-pages
          force_orphan: true
