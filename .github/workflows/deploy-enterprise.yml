name: Deploy Enterprise (Multi-Cloud)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'internal/**'
      - 'cmd/server/enterprise/**'
      - 'deploy/kubernetes/**'
      - 'deploy/terraform/**'
  workflow_dispatch:
    inputs:
      clouds:
        description: 'Target clouds (comma-separated: gcp,aws,ibm)'
        required: true
        default: 'gcp,aws,ibm'
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  check-secrets:
    name: Check cloud credentials
    runs-on: ubuntu-latest
    outputs:
      gcp_configured: ${{ steps.gcp.outputs.configured }}
      aws_configured: ${{ steps.aws.outputs.configured }}
    steps:
      - name: Detect GCP credentials
        id: gcp
        env:
          GCP_WIDP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$GCP_WIDP" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER not set – GCP enterprise deploy will be skipped."
          fi

      - name: Detect AWS credentials
        id: aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ACCESS_KEY_ID not set – AWS enterprise deploy will be skipped."
          fi

  build-enterprise:
    name: Build Enterprise Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Enterprise image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.enterprise
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cryptobom-enterprise:${{ github.sha }}
            ghcr.io/${{ github.repository }}/cryptobom-enterprise:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-gcp-enterprise:
    name: Deploy Enterprise → GCP
    runs-on: ubuntu-latest
    needs: [check-secrets, build-enterprise]
    if: needs.check-secrets.outputs.gcp_configured == 'true'
    environment: enterprise-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: cryptobom-gke
          location: europe-west3
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Enterprise to GKE
        run: |
          kubectl apply -f deploy/kubernetes/namespace.yaml
          kubectl apply -f deploy/kubernetes/ -n cryptobom-system
          kubectl set env deployment/cryptobom-server \
            CRYPTOBOM_EDITION=enterprise \
            IBM_CLOUD_API_KEY="${{ secrets.IBM_CLOUD_API_KEY }}" \
            IBM_HPCS_INSTANCE="${{ secrets.IBM_HPCS_INSTANCE }}" \
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -n cryptobom-system
          kubectl rollout status deployment/cryptobom-server \
            -n cryptobom-system --timeout=15m

  deploy-aws-enterprise:
    name: Deploy Enterprise → AWS
    runs-on: ubuntu-latest
    needs: [check-secrets, build-enterprise]
    if: needs.check-secrets.outputs.aws_configured == 'true'
    environment: enterprise-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name cryptobom-eks --region eu-central-1 2>/dev/null || \
          echo "EKS cluster not yet provisioned – Terraform apply required first"

  deploy-ibm-enterprise:
    name: Deploy Enterprise → IBM Cloud
    runs-on: ubuntu-latest
    needs: build-enterprise
    environment: enterprise-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to IBM Cloud Kubernetes
        run: |
          echo "IBM Cloud deployment requires ibmcloud CLI – skipping in CI stub"
          echo "Run: ibmcloud ks cluster config --cluster cryptobom-iks"
          echo "Then: kubectl apply -f deploy/kubernetes/"

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7'

      - name: Terraform init & validate (GCP)
        working-directory: deploy/terraform/gcp
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform init & validate (AWS)
        working-directory: deploy/terraform/aws
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform init & validate (IBM)
        working-directory: deploy/terraform/ibm
        run: |
          terraform init -backend=false
          terraform validate
