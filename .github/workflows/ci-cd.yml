name: CryptoBOM SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # CodeQL Analysis
  # Default GitHub CodeQL setup is enabled on this repo. Advanced SARIF
  # uploads are rejected with "cannot be processed when the default setup is enabled".
  codeql-analysis:
    name: CodeQL Analysis
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  
  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec.sarif ./...
        continue-on-error: true

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: --timeout=5m
        continue-on-error: true

      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'

      - name: Upload Security Results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gosec.sarif
            trivy.sarif
            codeql.sarif

  # OSS Gate — verify no enterprise import paths are reachable from the OSS binary
  oss-gate:
    name: OSS Gate
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify OSS build compiles without enterprise imports
        run: go build -tags oss ./cmd/server/oss/...

      - name: Verify OSS binary has no enterprise import paths
        run: |
          # Fail if any OSS-reachable package imports the enterprise package
          if go list -tags oss -deps ./cmd/server/oss/... | grep -q 'cryptobom-saas/internal/api/enterprise'; then
            echo "ERROR: enterprise import path found in OSS build" >&2
            exit 1
          fi
          echo "OSS gate passed: no enterprise imports reachable"

  # Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: cryptobom
          POSTGRES_DB: cryptobom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgres://cryptobom:postgres@localhost:5432/cryptobom_test?sslmode=disable
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Test OSS Build
        run: |
          go build -tags oss ./cmd/server/oss/...
          ./build.sh oss latest

      - name: Test Enterprise Build
        run: |
          ./build.sh enterprise latest

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage.out
            coverage.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/cryptobom-oss
            bin/cryptobom-enterprise

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: cryptobom
          POSTGRES_DB: cryptobom_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Start OSS Server
        run: ./run-edition.sh oss start

      - name: Start Enterprise Server
        run: ./run-edition.sh enterprise start

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://cryptobom:postgres@localhost:5432/cryptobom_integration?sslmode=disable
        run: |
          go test -v -tags=integration ./tests/integration/...

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/integration/results/

  # Production Validation
  production-validation:
    name: Production Validation
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    env:
      DATABASE_URL: postgres://cryptobom:postgres@localhost:5432/cryptobom_validation?sslmode=disable
      JWT_SECRET: production-validation-secret-please-replace
      KUBE_CONFIG_STAGING: dummy
      KUBE_CONFIG_PROD: dummy
      IBMQ_API_KEY: dummy
      GCP_WORKLOAD_IDENTITY_PROVIDER: dummy
      GCP_SERVICE_ACCOUNT: dummy@example.com
      GCP_PROJECT_ID: dummy-project
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      IBM_CLOUD_API_KEY: dummy
      IBM_HPCS_INSTANCE: dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm charts
        run: |
          helm lint deploy/helm/cryptobom-oss
          helm lint deploy/helm/cryptobom-saas

      - name: Download modules
        run: go mod download

      - name: Build OSS server
        run: go build -o /tmp/cryptobom-oss ./cmd/server/oss/main.go

      - name: Start OSS server
        run: |
          /tmp/cryptobom-oss > /tmp/cryptobom-oss.log 2>&1 &
          echo $! > /tmp/cryptobom-oss.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cryptobom-oss.log
          exit 1

      - name: Validate OSS production readiness
        run: API_URL=http://localhost:8080/api/v1 ./scripts/production-readiness.sh --strict

      - name: Build Enterprise server
        run: go build -tags enterprise -o /tmp/cryptobom-enterprise ./cmd/server/enterprise/main.go

      - name: Start Enterprise server
        run: |
          /tmp/cryptobom-enterprise > /tmp/cryptobom-enterprise.log 2>&1 &
          echo $! > /tmp/cryptobom-enterprise.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9090/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cryptobom-enterprise.log
          exit 1

      - name: Validate Enterprise production readiness
        run: API_URL=http://localhost:9090/api/v1 ./scripts/production-readiness.sh --strict

      - name: Stop validation servers
        if: always()
        run: |
          kill "$(cat /tmp/cryptobom-oss.pid)" 2>/dev/null || true
          kill "$(cat /tmp/cryptobom-enterprise.pid)" 2>/dev/null || true

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Performance Benchmarks
        run: |
          go test -run '^$' -bench 'Benchmark(APICalls|DatasetGeneration)$' -benchmem -cpuprofile=cpu.prof -memprofile=mem.prof ./tests/... | tee benchmark-results.txt

      - name: Compare Against Benchmark Baseline
        env:
          BENCHMARK_REGRESSION_THRESHOLD_PERCENT: '20'
        run: |
          python3 scripts/compare_benchmarks.py \
            --input benchmark-results.txt \
            --baseline tests/benchmark-baseline.json \
            --output benchmark-results.json \
            --threshold-percent "$BENCHMARK_REGRESSION_THRESHOLD_PERCENT" \
            --fail-on-regression

      - name: Run Performance Load Tests
        run: go test -run=TestPerformanceLoadTests ./tests/...

      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            benchmark-results.txt
            benchmark-results.json
            cpu.prof
            mem.prof

  # Container Security and Build
  container-build:
    name: Container Build and Security
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-test]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        edition: [oss, enterprise]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image path
        id: img
        run: echo "path=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.${{ matrix.edition }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.path }}:${{ matrix.edition }}-latest
            ${{ steps.img.outputs.path }}:${{ matrix.edition }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.path }}:${{ matrix.edition }}-${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.edition }}
          path: sbom.json

      - name: Container Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.path }}:${{ matrix.edition }}-latest
          format: 'sarif'
          output: 'container-scan.sarif'

      - name: Upload Container Security Results
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ matrix.edition }}
          path: container-scan.sarif

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [container-build, integration-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Get current revision (for rollback)
        id: current-revision
        run: |
          REVISION=$(helm status cryptobom-oss -n cryptobom-staging 2>/dev/null | grep REVISION | awk '{print $2}' || echo '0')
          echo "oss-revision=$REVISION" >> $GITHUB_OUTPUT
          REVISION=$(helm status cryptobom-enterprise -n cryptobom-enterprise-staging 2>/dev/null | grep REVISION | awk '{print $2}' || echo '0')
          echo "enterprise-revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Deploy OSS to Staging
        run: |
          helm upgrade --install cryptobom-oss ./deploy/helm/cryptobom-oss \
            --namespace cryptobom-staging \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --wait --timeout=10m

      - name: Deploy Enterprise to Staging
        run: |
          helm upgrade --install cryptobom-enterprise ./deploy/helm/cryptobom-enterprise \
            --namespace cryptobom-enterprise-staging \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --wait --timeout=10m

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/cryptobom-server -n cryptobom-staging --timeout=10m
          kubectl rollout status deployment/cryptobom-server -n cryptobom-enterprise-staging --timeout=10m

      - name: Run Comprehensive Smoke Tests
        timeout-minutes: 5
        run: |
          set -e
          echo "Waiting for deployments to be ready..."
          sleep 30
          
          echo "Checking pod health..."
          kubectl get pods -n cryptobom-staging
          kubectl get pods -n cryptobom-enterprise-staging
          
          # Health check with retries
          echo "Running health checks..."
          for i in {1..10}; do
            if curl -sf https://staging.cryptobom.io/oss/healthz > /dev/null; then
              echo "✓ OSS health check passed"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "✗ OSS health check failed after 10 retries"
              exit 1
            fi
            echo "Health check attempt $i/10, retrying..."
            sleep 5
          done
          
          for i in {1..10}; do
            if curl -sf https://staging.cryptobom.io/enterprise/healthz > /dev/null; then
              echo "✓ Enterprise health check passed"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "✗ Enterprise health check failed after 10 retries"
              exit 1
            fi
            echo "Health check attempt $i/10, retrying..."
            sleep 5
          done
          
          # API endpoint tests
          echo "Testing API endpoints..."
          curl -sf https://staging.cryptobom.io/oss/api/v1/assets -H "Accept: application/json" > /dev/null && echo "✓ OSS assets endpoint working"
          curl -sf https://staging.cryptobom.io/enterprise/api/v1/assets -H "Accept: application/json" > /dev/null && echo "✓ Enterprise assets endpoint working"
          
          # Dashboard check
          curl -sf https://staging.cryptobom.io/ > /dev/null && echo "✓ Dashboard accessible"
          
          echo "✓ All smoke tests passed!"

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          helm rollback cryptobom-oss ${{ steps.current-revision.outputs.oss-revision }} -n cryptobom-staging --wait || true
          helm rollback cryptobom-enterprise ${{ steps.current-revision.outputs.enterprise-revision }} -n cryptobom-enterprise-staging --wait || true
          kubectl rollout status deployment/cryptobom-server -n cryptobom-staging --timeout=5m || true
          kubectl rollout status deployment/cryptobom-server -n cryptobom-enterprise-staging --timeout=5m || true
          echo "Rollback complete"
          exit 1

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [container-build, performance-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Get current revision (for rollback)
        id: current-revision
        run: |
          REVISION=$(helm status cryptobom-oss -n cryptobom-production 2>/dev/null | grep REVISION | awk '{print $2}' || echo '0')
          echo "oss-revision=$REVISION" >> $GITHUB_OUTPUT
          REVISION=$(helm status cryptobom-enterprise -n cryptobom-enterprise-production 2>/dev/null | grep REVISION | awk '{print $2}' || echo '0')
          echo "enterprise-revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Deploy OSS to Production
        run: |
          helm upgrade --install cryptobom-oss ./deploy/helm/cryptobom-oss \
            --namespace cryptobom-production \
            --set image.tag=${{ github.sha }} \
            --set environment=production \
            --wait --timeout=15m \
            --set resources.requests.cpu=500m \
            --set resources.requests.memory=512Mi \
            --set resources.limits.cpu=1000m \
            --set resources.limits.memory=1Gi

      - name: Deploy Enterprise to Production
        run: |
          helm upgrade --install cryptobom-enterprise ./deploy/helm/cryptobom-enterprise \
            --namespace cryptobom-enterprise-production \
            --set image.tag=${{ github.sha }} \
            --set environment=production \
            --wait --timeout=15m \
            --set resources.requests.cpu=1000m \
            --set resources.requests.memory=1Gi \
            --set resources.limits.cpu=2000m \
            --set resources.limits.memory=2Gi \
            --set replicaCount=2

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/cryptobom-server -n cryptobom-production --timeout=15m
          kubectl rollout status deployment/cryptobom-server -n cryptobom-enterprise-production --timeout=15m

      - name: Run Production Smoke Tests
        timeout-minutes: 10
        run: |
          set -e
          echo "Waiting for production deployments to stabilize..."
          sleep 60
          
          echo "Checking pod health in production..."
          kubectl get pods -n cryptobom-production
          kubectl get pods -n cryptobom-enterprise-production
          
          # Production health checks with retries
          echo "Running production health checks..."
          for i in {1..15}; do
            if curl -sf https://cryptobom.io/oss/healthz > /dev/null; then
              echo "✓ OSS health check passed"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "✗ OSS health check failed after 15 retries"
              exit 1
            fi
            echo "Health check attempt $i/15, retrying..."
            sleep 10
          done
          
          for i in {1..15}; do
            if curl -sf https://cryptobom.io/enterprise/healthz > /dev/null; then
              echo "✓ Enterprise health check passed"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "✗ Enterprise health check failed after 15 retries"
              exit 1
            fi
            echo "Health check attempt $i/15, retrying..."
            sleep 10
          done
          
          # Production API tests
          echo "Testing production API endpoints..."
          curl -sf https://cryptobom.io/oss/api/v1/assets -H "Accept: application/json" > /dev/null && echo "✓ OSS assets endpoint working"
          curl -sf https://cryptobom.io/enterprise/api/v1/assets -H "Accept: application/json" > /dev/null && echo "✓ Enterprise assets endpoint working"
          
          # Production dashboard check
          curl -sf https://cryptobom.io/ > /dev/null && echo "✓ Production dashboard accessible"
          
          echo "✓ All production smoke tests passed!"

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Production deployment failed. Rolling back..."
          helm rollback cryptobom-oss ${{ steps.current-revision.outputs.oss-revision }} -n cryptobom-production --wait || true
          helm rollback cryptobom-enterprise ${{ steps.current-revision.outputs.enterprise-revision }} -n cryptobom-enterprise-production --wait || true
          kubectl rollout status deployment/cryptobom-server -n cryptobom-production --timeout=10m || true
          kubectl rollout status deployment/cryptobom-server -n cryptobom-enterprise-production --timeout=10m || true
          echo "Production rollback complete"
          exit 1

      - name: Notify Deployment
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "🚀 CryptoBOM SaaS deployed to production!\nCommit: ${{ github.sha }}\nOSS: https://cryptobom.io/oss\nEnterprise: https://cryptobom.io/enterprise"
            }'

  # Benchmark Tests
  benchmark-tests:
    name: Benchmark and Dataset Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[benchmark]')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Benchmark Datasets
        run: |
          go run cmd/generate-datasets/main.go \
            --size=10000 \
            --output=datasets/benchmark-data.json

      - name: Run Full Benchmark Suite
        run: |
          go test -run '^$' -bench 'Benchmark(APICalls|DatasetGeneration)$' -benchmem -cpuprofile=cpu.prof -memprofile=mem.prof ./tests/... | tee benchmark-results.txt

      - name: Process Benchmark Results
        run: |
          python3 scripts/compare_benchmarks.py \
            --input benchmark-results.txt \
            --baseline tests/benchmark-baseline.json \
            --output benchmark-results.json \
            --threshold-percent 20 \
            --fail-on-regression

      - name: Profile Analysis
        if: always()
        run: |
          go tool pprof cpu.prof > cpu-analysis.txt
          go tool pprof mem.prof > mem-analysis.txt

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            datasets/benchmark-data.json
            benchmark-results.txt
            benchmark-results.json
            cpu.prof
            mem.prof
            cpu-analysis.txt
            mem-analysis.txt

  # Documentation Build
  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build documentation site
        working-directory: web
        run: npm run build
        env:
          REACT_APP_EDITION: community

      - name: Deploy Documentation to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/build
          destination_dir: docs