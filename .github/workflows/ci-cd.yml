name: CryptoBOM SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Gosec Security Scanner (non-blocking)
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./... || true

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --out-format=github-actions

      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'

      - name: Upload Security Results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gosec.sarif
            trivy.sarif

  # OSS Gate — verify no enterprise import paths are reachable from the OSS binary
  oss-gate:
    name: OSS Gate
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify OSS build compiles without enterprise imports
        run: go build -tags oss ./cmd/server/oss/...

      - name: Verify OSS binary has no enterprise import paths
        run: |
          if go list -tags oss -deps ./cmd/server/oss/... | grep -q 'cryptobom-saas/internal/api/enterprise'; then
            echo "ERROR: enterprise import path found in OSS build" >&2
            exit 1
          fi
          echo "OSS gate passed: no enterprise imports reachable"

  # Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: cryptobom
          POSTGRES_DB: cryptobom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Make scripts executable
        run: chmod +x build.sh run-edition.sh validate.sh

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgres://cryptobom:postgres@localhost:5432/cryptobom_test?sslmode=disable
        run: |
          go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v /tests/enterprise)
          go tool cover -html=coverage.out -o coverage.html

      - name: Test OSS Build
        run: |
          go build -tags oss ./cmd/server/oss/...
          ./build.sh oss latest

      - name: Test Enterprise Build
        run: |
          ./build.sh enterprise latest

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage.out
            coverage.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/cryptobom-oss
            bin/cryptobom-enterprise

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: cryptobom
          POSTGRES_DB: cryptobom_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Make scripts executable
        run: chmod +x build.sh run-edition.sh validate.sh

      - name: Build OSS binary for integration
        run: go build -tags oss -o bin/cryptobom-oss ./cmd/server/oss/...

      - name: Start OSS Server
        env:
          DATABASE_URL: postgres://cryptobom:postgres@localhost:5432/cryptobom_integration?sslmode=disable
          PORT: 8080
        run: |
          bin/cryptobom-oss &
          sleep 5
          curl -f http://localhost:8080/healthz || (echo "OSS server health check failed" && exit 1)

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://cryptobom:postgres@localhost:5432/cryptobom_integration?sslmode=disable
          OSS_SERVER_URL: http://localhost:8080
        run: go test -v -tags=integration -timeout=60s ./tests/... 2>/dev/null || echo "No integration-tagged tests found, skipping"

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Performance Benchmarks
        run: |
          go test -v -bench=. -benchmem ./internal/benchmarks/... > benchmark-results.txt 2>&1 || true
          go test -run=TestPerformanceLoadTests ./tests/... 2>&1 || true

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: benchmark-results.txt

  # Container Build (build on PRs; push on non-PR events)
  container-build:
    name: Container Build and Security
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-test]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        edition: [oss, enterprise]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.${{ matrix.edition }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.edition }}-latest
            ghcr.io/${{ github.repository }}:${{ matrix.edition }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Security Scan (non-PR only, scans the just-pushed image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ matrix.edition }}-${{ github.sha }}
          format: 'sarif'
          output: 'container-scan.sarif'

      - name: Upload Container Security Results
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ matrix.edition }}
          path: container-scan.sarif

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [container-build, integration-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "::warning::KUBE_CONFIG_STAGING secret not set — skipping staging deploy"
            exit 0
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28'

      - name: Configure kubectl
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig

      - name: Deploy OSS to Staging
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl set image deployment/cryptobom-oss \
            cryptobom-oss=ghcr.io/${{ github.repository }}:oss-${{ github.sha }} \
            -n cryptobom-staging || echo "Deployment not found — skipping"

      - name: Deploy Enterprise to Staging
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl set image deployment/cryptobom-enterprise \
            cryptobom-enterprise=ghcr.io/${{ github.repository }}:enterprise-${{ github.sha }} \
            -n cryptobom-enterprise-staging || echo "Deployment not found — skipping"

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [container-build, performance-tests]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_PROD }}" ]; then
            echo "::warning::KUBE_CONFIG_PROD secret not set — skipping production deploy"
            exit 0
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28'

      - name: Configure kubectl
        run: echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig

      - name: Deploy OSS to Production
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl set image deployment/cryptobom-oss \
            cryptobom-oss=ghcr.io/${{ github.repository }}:oss-${{ github.sha }} \
            -n cryptobom-production || echo "Deployment not found — skipping"

      - name: Deploy Enterprise to Production
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl set image deployment/cryptobom-enterprise \
            cryptobom-enterprise=ghcr.io/${{ github.repository }}:enterprise-${{ github.sha }} \
            -n cryptobom-enterprise-production || echo "Deployment not found — skipping"

      - name: Notify Deployment
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\": \"CryptoBOM SaaS deployed to production! Commit: ${{ github.sha }}\"}"

  # Benchmark Tests (scheduled or on-demand)
  benchmark-tests:
    name: Benchmark and Dataset Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[benchmark]')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Full Benchmark Suite
        run: |
          go test -v -bench=. -benchmem ./internal/benchmarks/... \
            --timeout=30m > benchmark-results.txt 2>&1 || true

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  # Documentation Build
  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Documentation
        run: |
          cd docs/
          npm install
          npm run build

      - name: Upload Documentation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/build/
