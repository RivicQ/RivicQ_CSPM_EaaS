# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build Next.js app
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build Next.js app
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_EDITION: oss

      - name: Publish Quantum SDK & plugin docs to the site
        run: |
          mkdir -p web/out/docs/sdks
          cp docs-oss/quantum-sdk/quantum-sdk.md web/out/docs/
          cp docs-oss/quantum-sdk/plugin-development.md web/out/docs/
          cp docs-oss/quantum-sdk/enterprise-sdk.md web/out/docs/
          cp docs-oss/quantum-sdk/sdks/*.md web/out/docs/sdks/
          cat > web/out/docs/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Quantum SDK &amp; Plugin Ecosystem</title>
          <style>
            body{font-family:Inter,system-ui,sans-serif;margin:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(99,102,241,.18),transparent 60%),#0b0f1a;color:#e6e8f0}
            main{max-width:760px;margin:0 auto;padding:64px 24px}
            a{color:#8b93ff;text-decoration:none} a:hover{text-decoration:underline}
            h1{font-size:2rem;letter-spacing:-.02em}
            .cards{display:grid;gap:12px;margin-top:28px}
            .card{background:#131a2b;border:1px solid #232d45;border-radius:10px;padding:16px 18px}
            .card h2{font-size:1rem;margin:0 0 4px}
            .card p{margin:0;color:#9aa3c0;font-size:.9rem}
          </style></head>
          <body><main>
            <h1>Quantum SDK &amp; Plugin Ecosystem</h1>
            <p>Open-source post-quantum provider SDK for the CSPM platform.</p>
            <div class="cards">
              <div class="card"><h2><a href="quantum-sdk.md">SDK Architecture</a></h2><p>Provider contract, registry, plugin manifests.</p></div>
              <div class="card"><h2><a href="plugin-development.md">Plugin Development Guide</a></h2><p>Write and sign provider plugins.</p></div>
              <div class="card"><h2><a href="enterprise-sdk.md">Enterprise SDK</a></h2><p>Extend the platform with cloud providers.</p></div>
              <div class="card"><h2><a href="sdks/README.md">Language Bindings</a></h2><p>Rust, Python, TypeScript, Java, .NET.</p></div>
            </div>
          </main></body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/out'

  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
