name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  GCP_REGION: 'europe-west3'
  GKE_CLUSTER: 'cryptobom-gke'
  IMAGE_NAME: 'cryptobom'

jobs:
  build:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push OSS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.oss
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cryptobom/cryptobom-oss:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cryptobom/cryptobom-oss:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f deploy/kubernetes/namespace.yaml
          kubectl apply -f deploy/kubernetes/configmap.yaml
          kubectl set image deployment/cryptobom-server \
            cryptobom=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cryptobom/cryptobom-oss:${{ github.sha }} \
            -n cryptobom-system || \
          kubectl apply -f deploy/kubernetes/deployment.yaml -n cryptobom-system
          kubectl apply -f deploy/kubernetes/service.yaml -n cryptobom-system
          kubectl apply -f deploy/kubernetes/hpa.yaml -n cryptobom-system
          kubectl apply -f deploy/kubernetes/ingress.yaml -n cryptobom-system

      - name: Run database migrations
        run: |
          kubectl create job --from=cronjob/cryptobom-migrate db-migrate-${{ github.sha }} \
            -n cryptobom-system 2>/dev/null || \
          echo "Migration job triggered (or no cronjob configured)"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cryptobom-server \
            -n cryptobom-system --timeout=10m

      - name: Health check
        run: |
          echo "Deployment complete. Verify at https://cryptobom.io/healthz"
