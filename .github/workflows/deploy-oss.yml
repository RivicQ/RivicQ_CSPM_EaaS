name: Deploy OSS (manual)

# Triggered manually from the GitHub Actions UI.
# Publishes the OSS container image to any OCI-compliant registry.
#
# Required secrets / variables
# ─────────────────────────────────────────────────────────────────────────────
#  REGISTRY          – OCI registry host, e.g. ghcr.io or docker.io
#                      (defaults to ghcr.io when not set)
#  REGISTRY_USERNAME – registry login name
#                      (defaults to github.actor for GHCR)
#  REGISTRY_PASSWORD – registry login secret / token
#                      (defaults to GITHUB_TOKEN for GHCR)
#
# See docs/DEPLOYMENT.md for full setup instructions.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (e.g. v1.2.0 or latest)'
        required: true
        default: 'latest'
      registry:
        description: 'Target registry (leave blank to use the REGISTRY secret / ghcr.io)'
        required: false
        default: ''

env:
  DEFAULT_REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & publish OSS image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # ── Resolve registry ─────────────────────────────────────────────────
      - name: Resolve registry
        id: reg
        env:
          INPUT_REGISTRY: ${{ inputs.registry }}
          SECRET_REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          REGISTRY="${INPUT_REGISTRY:-${SECRET_REGISTRY:-ghcr.io}}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      # ── Build Go binary ───────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: go mod download

      - name: Build OSS binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags "-X main.version=${{ inputs.image_tag }} -X main.edition=oss" \
            -o bin/cryptobom-oss \
            ./cmd/server/oss/main.go

      # ── Container image ───────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD != '' && secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          REGISTRY="${{ steps.reg.outputs.registry }}"
          IMAGE="${REGISTRY}/${{ github.repository }}/cryptobom-oss"
          TAG="${{ inputs.image_tag }}"
          echo "full=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.oss
          push: true
          tags: |
            ${{ steps.image.outputs.full }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## ✅ OSS image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ steps.image.outputs.full }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Registry** | \`${{ steps.reg.outputs.registry }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
