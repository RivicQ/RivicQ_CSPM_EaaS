name: CI – Enterprise

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cryptobom-enterprise

jobs:
  test-enterprise:
    name: Test (enterprise)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: go mod download

      - name: Run unit tests (enterprise)
        run: |
          set -o pipefail
          go test -tags enterprise -v -race -coverprofile=coverage.enterprise.out ./... 2>&1 | tee /tmp/enterprise-tests.log

      - name: Annotate enterprise test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          path = "/tmp/enterprise-tests.log"
          if not os.path.exists(path):
              raise SystemExit(0)
          with open(path, encoding="utf-8", errors="replace") as handle:
              lines = handle.read().splitlines()
          markers = ("--- FAIL", "FAIL", "WARNING: DATA RACE", "Error Trace", "panic:")
          relevant = [line for line in lines if any(marker in line for marker in markers)]
          for line in relevant[:40]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{escaped}")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-enterprise
          path: coverage.enterprise.out

  build-enterprise:
    name: Build Enterprise binary + smoke
    runs-on: ubuntu-latest
    needs: test-enterprise
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://cryptobom:postgres@localhost:5432/cryptobom_enterprise_ci?sslmode=disable
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: cryptobom
          POSTGRES_DB: cryptobom_enterprise_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate local CI license
        run: |
          python3 - <<'PY'
          import hashlib, hmac, os, time
          secret = "ci-local-license-signing-key"
          expiry = int(time.time()) + 86400
          signature = hmac.new(secret.encode(), f"*.{expiry}".encode(), hashlib.sha256).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CRYPTOBOM_LICENSE_KEY=cryptobom-beta-v1.*.{expiry}.{signature}\n")
              env.write(f"CRYPTOBOM_LICENSE_SIGNING_KEY={secret}\n")
          PY

      - name: Build enterprise binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build \
            -tags=enterprise \
            -ldflags "-X main.version=${{ github.sha }} -X main.edition=enterprise" \
            -o bin/cryptobom-enterprise \
            ./cmd/server/enterprise/main.go

      - name: Start IBMQ mock server
        run: |
          # Start mock IBMQ if present; background it
          if [ -f demo/mock-ibmq/mock_server.go ]; then
            nohup go run demo/mock-ibmq/mock_server.go > mock_ibmq.log 2>&1 &
            echo $! > /tmp/mock_ibmq.pid
            sleep 1
            echo "Started mock IBMQ server"
          else
            echo "No mock IBMQ server found"
          fi

      - name: Start enterprise backend with local CI database
        run: |
          DATABASE_URL="$DATABASE_URL" JWT_SECRET=enterprise-smoke-secret-0123456789abcdef AUTH_BOOTSTRAP_PASSWORD='Ci-Only-Bootstrap-P4ss!' \
            CRYPTOBOM_PORT=8081 IBMQ_ENDPOINT="http://localhost:8089" ./bin/cryptobom-enterprise &
          echo $! > /tmp/cryptobom-enterprise.pid

      - name: Wait for healthz
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/healthz; then
              echo "Enterprise backend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Enterprise backend did not start"; exit 1

      - name: Stop processes
        if: always()
        run: |
          if [ -f /tmp/cryptobom-enterprise.pid ]; then kill "$(cat /tmp/cryptobom-enterprise.pid)" || true; fi
          if [ -f /tmp/mock_ibmq.pid ]; then kill "$(cat /tmp/mock_ibmq.pid)" || true; fi

  helm-lint-enterprise:
    name: Helm lint (enterprise chart)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint enterprise chart when templates are present
        run: |
          set -euo pipefail
          if [ -d deploy/helm/cryptobom-enterprise/templates ] && find deploy/helm/cryptobom-enterprise/templates -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.tpl' \) | grep -q .; then
            echo "Enterprise chart templates detected; running blocking helm lint."
            helm lint deploy/helm/cryptobom-enterprise
          else
            echo "Enterprise chart templates are absent; skipping helm lint for now."
            echo "This check becomes blocking automatically once templates are added under deploy/helm/cryptobom-enterprise/templates."
          fi
