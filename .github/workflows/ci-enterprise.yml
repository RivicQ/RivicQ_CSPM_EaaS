name: CI – Enterprise

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cryptobom-enterprise

jobs:
  test-enterprise:
    name: Test (enterprise)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: go mod download

      - name: Run unit tests (enterprise)
        run: |
          # Run enterprise-tagged and untagged tests; mock external services when possible
          go test -tags enterprise -v -race -coverprofile=coverage.enterprise.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-enterprise
          path: coverage.enterprise.out

  build-enterprise:
    name: Build Enterprise binary + smoke
    runs-on: ubuntu-latest
    needs: test-enterprise
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build enterprise binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build \
            -tags=enterprise \
            -ldflags "-X main.version=${{ github.sha }} -X main.edition=enterprise" \
            -o bin/cryptobom-enterprise \
            ./cmd/server/enterprise/main.go

      - name: Start IBMQ mock server
        run: |
          # Start mock IBMQ if present; background it
          if [ -f demo/mock-ibmq/mock_server.go ]; then
            nohup go run demo/mock-ibmq/mock_server.go > mock_ibmq.log 2>&1 &
            echo $! > /tmp/mock_ibmq.pid
            sleep 1
            echo "Started mock IBMQ server"
          else
            echo "No mock IBMQ server found"
          fi

      - name: Start enterprise backend in demo mode (uses mock IBMQ)
        run: |
          DATABASE_URL="" JWT_SECRET=enterprise-smoke-secret-0123456789abcdef AUTH_BOOTSTRAP_PASSWORD=enterprise-smoke-bootstrap-please-replace \
            CRYPTOBOM_PORT=8081 IBMQ_ENDPOINT="http://localhost:8089" ./bin/cryptobom-enterprise &
          echo $! > /tmp/cryptobom-enterprise.pid

      - name: Wait for healthz
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/healthz; then
              echo "Enterprise backend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Enterprise backend did not start"; exit 1

      - name: Stop processes
        if: always()
        run: |
          if [ -f /tmp/cryptobom-enterprise.pid ]; then kill "$(cat /tmp/cryptobom-enterprise.pid)" || true; fi
          if [ -f /tmp/mock_ibmq.pid ]; then kill "$(cat /tmp/mock_ibmq.pid)" || true; fi

  helm-lint-enterprise:
    name: Helm lint (enterprise chart)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint enterprise chart when templates are present
        run: |
          set -euo pipefail
          if [ -d deploy/helm/cryptobom-enterprise/templates ] && find deploy/helm/cryptobom-enterprise/templates -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.tpl' \) | grep -q .; then
            echo "Enterprise chart templates detected; running blocking helm lint."
            helm lint deploy/helm/cryptobom-enterprise
          else
            echo "Enterprise chart templates are absent; skipping helm lint for now."
            echo "This check becomes blocking automatically once templates are added under deploy/helm/cryptobom-enterprise/templates."
          fi
