name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go version

      - name: Build core
        run: go build -o /dev/null ./cmd/server/

      - name: Build OSS
        run: go build -o /dev/null ./cmd/server/oss/

      - name: Build RivicQ CLI
        run: go build -o /dev/null ./cmd/rivicq

      - name: Build Enterprise
        run: go build -tags enterprise -o /dev/null ./cmd/server/enterprise/

      - name: Vet
        run: go vet ./...

      - name: Test (short)
        run: go test -count=1 -short ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run build --if-present

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          install-mode: goinstall
          args: --timeout=5m ./...
