<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RivicQ documentation</title>
    <meta name="theme-color" content="#0c0b09" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/horizon-docs.css?v=20260908" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="logo" href="index.html"><span>RivicQ</span><span class="logo-badge">Docs</span></a>
      <nav class="header-links" aria-label="Documentation">
        <a href="index.html">Hub</a>
        <a href="index.html#workflow">Workflow</a>
        <a href="contact.html">Directory</a>
        <a href="../">Console</a>
      </nav>
    </header>
    <main id="main" class="md-wrap">
      <p class="hero-eyebrow" id="doc-kicker">Documentation</p>
      <article class="md-body" id="doc-body">Loading…</article>
    </main>
    <footer class="site-footer">
      <p>© 2026 RivicQ GmbH · Control mappings are not certifications. Pages demos never publish secret values.</p>
      <p class="footer-mails">
        <a href="index.html">Docs hub</a>
        <a href="contact.html">Directory</a>
        <a id="raw-link" href="#">Raw markdown</a>
      </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script>
      const ALLOWED = new Set([
        "ARCHITECTURE.md",
        "BOM_FRAMEWORK.md",
        "CLIENT_ARCHITECTURE.md",
        "CONTACT.md",
        "CONTRIBUTING.md",
        "DATASETS.md",
        "KNOWN_LIMITATIONS.md",
        "LAUNCH_CHECKLIST.md",
        "LEGAL.md",
        "NEXUS.md",
        "NOTICE",
        "PQC_MIGRATION.md",
        "PRIVACY.md",
        "PRODUCT_STATUS.md",
        "QISKIT_PIPELINE.md",
        "README.md",
        "ROADMAP.md",
        "SECURITY.md",
        "TRADEMARKS.md",
        "UX_DESIGN.md",
        "editions.md",
        "plugin-development.md",
        "quantum-sdk.md",
        "security-intelligence.md",
        "sdks/README.md",
        "sdks/dotnet.md",
        "sdks/java.md",
        "sdks/python.md",
        "sdks/rust.md",
        "sdks/typescript.md",
      ]);
      const params = new URLSearchParams(location.search);
      const requested = params.get("doc") || "CLIENT_ARCHITECTURE.md";
      const doc = ALLOWED.has(requested) ? requested : "";
      const body = document.getElementById("doc-body");
      const kicker = document.getElementById("doc-kicker");
      const raw = document.getElementById("raw-link");
      if (!doc) {
        body.innerHTML = "<p>That document is not on the published Pages set. Return to the <a href=\"index.html\">docs hub</a>.</p>";
      } else {
        kicker.textContent = "Documentation · " + doc;
        document.title = doc + " — RivicQ documentation";
        raw.href = doc;
        fetch(doc)
          .then(function (res) {
            if (!res.ok) throw new Error("missing");
            return res.text();
          })
          .then(function (md) {
            body.innerHTML = window.marked.parse(md, { gfm: true, breaks: false });
            body.querySelectorAll("a[href$='.md']").forEach(function (a) {
              var href = a.getAttribute("href") || "";
              var name = href.replace(/^\.\.\//, "").split("/").pop();
              if (name && ALLOWED.has(name)) a.setAttribute("href", "read.html?doc=" + encodeURIComponent(name));
              else if (name && ALLOWED.has(href)) a.setAttribute("href", "read.html?doc=" + encodeURIComponent(href));
            });
          })
          .catch(function () {
            body.innerHTML = "<p>Could not load " + doc + ". Open the <a href=\"index.html\">docs hub</a>.</p>";
          });
      }
    </script>
  </body>
</html>
