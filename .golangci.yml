version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    # Third-party Go code shipped inside web/node_modules must not be analyzed.
    paths:
      - web/node_modules
      - nexus/node_modules
      - node_modules
      - fixtures
      - testdata

run:
  timeout: 5m
