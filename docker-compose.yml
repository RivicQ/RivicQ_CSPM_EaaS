version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.oss
    container_name: cryptobom-saas
    ports:
      - "8080:8080"
    environment:
      - CRYPTOBOM_PORT=8080
      - CRYPTOBOM_LOG_LEVEL=info
    env_file:
      - path: .env
        required: false
    networks:
      - cryptobom-net

  web:
    image: node:18-alpine
    container_name: cryptobom-web
    working_dir: /app/web
    volumes:
      - ./web:/app/web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # REACT_APP_API_URL is used by the browser, not the container.
      # Keep this as localhost:<host-port> so the browser can reach the API.
      - REACT_APP_API_URL=http://localhost:8080
    command: npm start
    networks:
      - cryptobom-net
    depends_on:
      - app

  scanner:
    image: python:3.11-alpine
    container_name: cryptobom-scanner
    working_dir: /app
    volumes:
      - .:/app
    command: |
      sh -c "pip install requests && python examples/scan.py --target all --output /app/cbom.json"
    networks:
      - cryptobom-net

networks:
  cryptobom-net:
    driver: bridge
