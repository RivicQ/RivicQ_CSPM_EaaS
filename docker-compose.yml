services:
  db:
    image: postgres:15-alpine
    container_name: cryptobom-db
    environment:
      POSTGRES_USER: cryptobom
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cryptobom_dev}
      POSTGRES_DB: cryptobom
    volumes:
      - cryptobom-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobom"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cryptobom-net

  migrate:
    image: postgres:15-alpine
    container_name: cryptobom-migrate
    volumes:
      - ./deploy/migrations:/migrations:ro
      - migrate-status:/migrate-status
    environment:
      PGPASSWORD: ${DB_PASSWORD:-cryptobom_dev}
    command: >
      sh -c "set -e; for f in $(ls /migrations/*.sql | sort); do
               echo \"Applying $$f ...\";
               psql -h db -U cryptobom -d cryptobom -f $$f;
             done; mkdir -p /migrate-status && touch /migrate-status/done"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cryptobom-net

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.oss
    container_name: cryptobom-saas
    ports:
      - "8080:8080"
    environment:
      - CRYPTOBOM_PORT=8080
      - CRYPTOBOM_LOG_LEVEL=info
      - CRYPTOBOM_DB_HOST=db
      - CRYPTOBOM_DB_PORT=5432
      - CRYPTOBOM_DB_USER=cryptobom
      - CRYPTOBOM_DB_PASSWORD=${DB_PASSWORD:-cryptobom_dev}
      - CRYPTOBOM_DB_NAME=cryptobom
      - CRYPTOBOM_DB_SSLMODE=disable
      - FRONTEND_REDIRECT_URL=http://localhost:3000
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - migrate-status:/migrate-status
    networks:
      - cryptobom-net

  web:
    image: node:18-alpine
    container_name: cryptobom-web
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - cryptobom-web-node-modules:/app/web/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # REACT_APP_API_URL is used by the browser, not the container.
      # Keep this as localhost:<host-port> so the browser can reach the API.
      - REACT_APP_API_URL=http://localhost:8080
    command: sh -c "npm install --silent && npm run dev"
    networks:
      - cryptobom-net
    depends_on:
      - app

  scanner:
    image: python:3.11-alpine
    container_name: cryptobom-scanner
    working_dir: /app
    volumes:
      - .:/app
    command: |
      sh -c "pip install requests && python examples/scan.py --target all --output /app/cbom.json"
    networks:
      - cryptobom-net

networks:
  cryptobom-net:
    driver: bridge

volumes:
  cryptobom-db-data:
  cryptobom-web-node-modules:
  migrate-status:
