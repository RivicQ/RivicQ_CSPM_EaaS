<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Rivic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .auth-box {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin: 0 0 10px 0;
        }
        
        .auth-header p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: Inter, sans-serif;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: Inter, sans-serif;
            background: white;
            cursor: pointer;
            box-sizing: border-box;
        }
        
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        
        .checkbox-wrapper input {
            width: auto;
            margin-right: 8px;
            margin-top: 4px;
            cursor: pointer;
        }
        
        .checkbox-wrapper label {
            margin: 0;
            font-size: 13px;
            cursor: pointer;
        }
        
        .checkbox-wrapper a {
            color: #667eea;
            text-decoration: none;
        }
        
        .checkbox-wrapper a:hover {
            text-decoration: underline;
        }
        
        .btn-signup {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #999;
            font-size: 14px;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }
        
        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
        }
        
        .social-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .social-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .social-btn:hover {
            background: #f5f5f5;
        }
        
        .auth-footer {
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        
        .auth-footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Sign Up</h1>
                <p>Create your Rivic account</p>
            </div>
            
            <form onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" placeholder="Your Company">
                </div>
                
                <div class="form-group">
                    <label for="plan">Plan</label>
                    <select id="plan" name="plan" required>
                        <option value="">Select a plan</option>
                        <option value="open-source">Open Source (Free)</option>
                        <option value="professional">Professional ($99/mo)</option>
                        <option value="enterprise">Enterprise (Custom)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>
                
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a></label>
                </div>
                
                <button type="submit" class="btn-signup">Create Account</button>
            </form>
            
            <div class="divider">
                <span>or</span>
            </div>
            
            <div class="social-buttons">
                <button class="social-btn" onclick="signUpWithGitHub()">GitHub</button>
                <button class="social-btn" onclick="signUpWithGoogle()">Google</button>
            </div>
            
            <div class="auth-footer">
                Already have an account? <a href="/signin">Sign in</a>
            </div>
        </div>
    </div>
    
    <script>
        function handleSignUp(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            const email = document.getElementById('email').value;
            const fullname = document.getElementById('fullname').value;
            const company = document.getElementById('company').value;
            const plan = document.getElementById('plan').value;
            
            console.log('Sign Up Attempt:', {
                fullname,
                email,
                company,
                plan,
                timestamp: new Date().toISOString()
            });
            
            // For demo purposes
            alert('Account created! You will be redirected to verify your email.');
            window.location.href = '/verify-email';
        }
        
        function signUpWithGitHub() {
            console.log('GitHub Sign Up');
            alert('GitHub sign up will be configured.');
        }
        
        function signUpWithGoogle() {
            console.log('Google Sign Up');
            alert('Google sign up will be configured.');
        }
    </script>
</body>
</html>
